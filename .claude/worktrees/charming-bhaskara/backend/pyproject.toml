[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ophthalmology-enterprise-platform-backend"
version = "0.1.0"
description = "Production-oriented backend for the Ophthalmology Enterprise Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.15.1,<2.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "celery>=5.4.0,<6.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "fastapi>=0.115.11,<1.0.0",
  "orjson>=3.10.15,<4.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.8.1,<3.0.0",
  "pwdlib[argon2]>=0.3.0,<1.0.0",
  "PyJWT>=2.10.1,<3.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "redis>=5.2.1,<6.0.0",
  "sqlalchemy>=2.0.38,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "mypy>=1.15.0,<2.0.0",
  "pytest>=8.3.5,<9.0.0",
  "pytest-asyncio>=0.25.3,<1.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "ruff>=0.11.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC", "B", "SIM", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
packages = ["app"]
