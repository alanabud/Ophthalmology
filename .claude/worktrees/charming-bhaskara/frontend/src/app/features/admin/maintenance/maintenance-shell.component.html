<div class="maintenance-shell">

  <!-- ================================================================
       MAINTENANCE LEFT NAVIGATION
       ================================================================ -->
  <aside class="maint-nav">
    <div class="maint-nav__header">
      <div class="maint-nav__title-row">
        <div class="maint-nav__icon">⚙</div>
        <div>
          <p class="maint-nav__title">Maintenance</p>
          <p class="maint-nav__subtitle">Platform configuration &amp; setup</p>
        </div>
      </div>
      <div class="maint-search">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="5" cy="5" r="4"/>
          <path d="M8.5 8.5L11 11"/>
        </svg>
        <input
          type="text"
          placeholder="Search maintenance areas…"
          [value]="searchQuery()"
          (input)="setSearch($any($event.target).value)"
          class="maint-search__input"
        />
      </div>
    </div>

    <nav class="maint-nav__body">
      @for (section of filteredSections(); track section.label) {
        <div class="maint-section">
          <div class="maint-section__label">{{ section.label }}</div>
          @for (item of section.items; track item.route) {
            <a
              class="maint-nav-item"
              [routerLink]="['/admin', item.route]"
              routerLinkActive="maint-nav-item--active"
            >
              <span class="maint-nav-item__icon">{{ item.icon }}</span>
              <span class="maint-nav-item__label">{{ item.label }}</span>
              @if (item.badge) {
                <span
                  class="maint-nav-item__badge"
                  [class]="'maint-nav-item__badge maint-nav-item__badge--' + (item.badgeTone ?? 'neutral')"
                >{{ item.badge }}</span>
              }
            </a>
          }
        </div>
      }
    </nav>
  </aside>

  <!-- ================================================================
       MAINTENANCE CONTENT AREA
       ================================================================ -->
  <main class="maint-content">
    <router-outlet />
  </main>

</div>
